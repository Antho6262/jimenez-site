<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Profil — Vizu 6Block's</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="sidebar"></div>
  <div id="main">
    <div class="page-header">
      <div class="page-title">👤 Mon <span>Profil</span></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card">
        <div class="card-title">Informations</div>
        <div id="profil-info"></div>
        <hr style="border-color:var(--border);margin:16px 0">
        <div class="card-title">Changer le mot de passe</div>
        <div class="form-group" style="margin-bottom:10px">
          <label>Nouveau mot de passe</label>
          <input type="password" id="new-pwd" placeholder="••••••••">
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label>Confirmer</label>
          <input type="password" id="confirm-pwd" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" onclick="changePwd()">Enregistrer</button>
      </div>

      <div class="card">
        <div class="card-title">Mes stats (semaine active)</div>
        <div class="stats-grid" style="grid-template-columns:1fr 1fr">
          <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-value" id="p-total">—</div><div class="stat-label">Actions</div></div>
          <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value" id="p-reussi">—</div><div class="stat-label">Réussies</div></div>
          <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value" id="p-gains">—</div><div class="stat-label">Gains</div></div>
          <div class="stat-card"><div class="stat-icon">📈</div><div class="stat-value" id="p-taux">—</div><div class="stat-label">Taux réussite</div></div>
        </div>

        <div style="margin-top:16px">
          <div class="card-title">Mes dernières actions</div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Action</th><th>Résultat</th><th>Gains</th></tr></thead>
              <tbody id="p-actions"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/app.js"></script>
  <script>
    buildSidebar('profil');
    const user = getUser();

    document.getElementById('profil-info').innerHTML = `
      <table>
        <tr><td style="color:var(--text-muted);width:120px">Prénom</td><td>${user?.prenom || '-'}</td></tr>
        <tr><td style="color:var(--text-muted)">Nom</td><td>${user?.nom || '-'}</td></tr>
        <tr><td style="color:var(--text-muted)">Grade</td><td><span class="badge badge-accent">${user?.grade || '-'}</span></td></tr>
        <tr><td style="color:var(--text-muted)">Rôle</td><td>${user?.role || '-'}</td></tr>
      </table>
    `;

    async function changePwd() {
      const pwd = document.getElementById('new-pwd').value;
      const conf = document.getElementById('confirm-pwd').value;
      if (!pwd) { showToast('Mot de passe vide', 'error'); return; }
      if (pwd !== conf) { showToast('Les mots de passe ne correspondent pas', 'error'); return; }
      await db.ref('membres/' + user.id + '/mot_de_passe').set(pwd);
      showToast('Mot de passe modifié !');
      document.getElementById('new-pwd').value = '';
      document.getElementById('confirm-pwd').value = '';
    }

    async function loadStats() {
      const semaine = await getSemaineActive();
      if (!semaine) return;
      const snap = await db.ref('actions/' + semaine.id).once('value');
      const actions = Object.entries(snap.val() || {}).map(([id, d]) => ({ id, ...d })).filter(a => a.membre_id === user.id);
      const reussi = actions.filter(a => a.resultat === 'Succès');
      document.getElementById('p-total').textContent = actions.length;
      document.getElementById('p-reussi').textContent = reussi.length;
      document.getElementById('p-gains').textContent = formatMoney(reussi.reduce((s, a) => s + (a.gains_totaux || 0), 0));
      document.getElementById('p-taux').textContent = actions.length ? Math.round(reussi.length / actions.length * 100) + '%' : '—';

      const sorted = [...actions].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 8);
      document.getElementById('p-actions').innerHTML = sorted.length ? sorted.map(a => `<tr>
        <td>${a.action || '-'}</td>
        <td><span class="badge ${a.resultat === 'Succès' ? 'badge-success' : 'badge-danger'}">${a.resultat}</span></td>
        <td>${formatMoney(a.gains_totaux)}</td>
      </tr>`).join('') : '<tr><td colspan="3"><div class="empty-state">Aucune action</div></td></tr>';
    }

    loadStats();
  </script>
</body>
</html>
