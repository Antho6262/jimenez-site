<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotas — Vizu 6Block's</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="sidebar"></div>
  <div id="main">
    <div class="page-header">
      <div class="page-title">🎯 <span>Quotas</span></div>
    </div>
    <div class="card">
      <div class="card-title">Respect des quotas — semaine active</div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Membre</th><th>Grade</th><th>Quota requis</th><th>Actions aujourd'hui</th><th>Statut</th></tr></thead>
          <tbody id="tbody-quotas"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/app.js"></script>
  <script>
    buildSidebar('quotas');

    async function load() {
      const semaine = await getSemaineActive();
      const membres = await getMembres();
      const today = new Date().toISOString().split('T')[0];

      let actions = [];
      if (semaine) {
        const snap = await db.ref('actions/' + semaine.id).once('value');
        actions = Object.entries(snap.val() || {}).map(([id, d]) => ({ id, ...d }));
      }

      const tbody = document.getElementById('tbody-quotas');
      tbody.innerHTML = membres.map(m => {
        const quotaRequis = m.quota_drogue || 0;
        const actionsAujourd = actions.filter(a => a.membre_id === m.id && a.date === today && a.action === 'Vente de Drogue' && a.resultat === 'Succès').length;
        const ok = actionsAujourd >= quotaRequis;
        return `<tr>
          <td>${m.prenom} ${m.nom}</td>
          <td><span class="badge badge-accent">${m.grade}</span></td>
          <td>${quotaRequis}</td>
          <td>${actionsAujourd}</td>
          <td><span class="badge ${ok ? 'badge-success' : 'badge-danger'}">${ok ? '✅ Respecté' : '❌ Non respecté'}</span></td>
        </tr>`;
      }).join('') || '<tr><td colspan="5"><div class="empty-state">Aucun membre</div></td></tr>';
    }

    load();
  </script>
</body>
</html>
