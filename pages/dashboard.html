<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Vizu 6Block's</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="sidebar"></div>
  <div id="main">
    <div class="page-header">
      <div class="page-title">Tableau de <span>bord</span></div>
      <div id="semaine-badge" class="badge badge-accent"></div>
    </div>

    <!-- Stats rapides -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value" id="s-sale">—</div><div class="stat-label">Argent Sale</div></div>
      <div class="stat-card"><div class="stat-icon">🏦</div><div class="stat-value" id="s-propre">—</div><div class="stat-label">Argent Propre</div></div>
      <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-value" id="s-actions">—</div><div class="stat-label">Actions semaine</div></div>
      <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value" id="s-reussi">—</div><div class="stat-label">Réussies</div></div>
      <div class="stat-card"><div class="stat-icon">❌</div><div class="stat-value" id="s-echoue">—</div><div class="stat-label">Échouées</div></div>
      <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value" id="s-membres">—</div><div class="stat-label">Membres actifs</div></div>
    </div>

    <!-- Alertes -->
    <div id="alertes-zone"></div>

    <!-- Dernières actions -->
    <div class="card">
      <div class="card-title">📋 Dernières actions</div>
      <div class="table-wrapper">
        <table>
          <thead><tr>
            <th>Heure</th><th>Membre</th><th>Action</th><th>Produit</th><th>Résultat</th><th>Gains</th>
          </tr></thead>
          <tbody id="last-actions"><tr><td colspan="6" class="empty-state">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Classement membres -->
    <div class="card">
      <div class="card-title">🏆 Classement de la semaine</div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>#</th><th>Membre</th><th>Actions</th><th>Réussies</th><th>Gains</th></tr></thead>
          <tbody id="classement"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/app.js"></script>
  <script>
    buildSidebar('dashboard');

    async function loadDashboard() {
      const semaine = await getSemaineActive();
      document.getElementById('semaine-badge').textContent = semaine ? semaine.nom : 'Aucune semaine active';

      // Argent
      let sale = 0, propre = 0;
      const snapSale = await db.ref('argent/sale').once('value');
      Object.values(snapSale.val() || {}).forEach(d => sale += (d.type === 'Entrée' ? 1 : -1) * (d.montant || 0));
      const snapPropre = await db.ref('argent/propre').once('value');
      Object.values(snapPropre.val() || {}).forEach(d => propre += (d.type === 'Entrée' ? 1 : -1) * (d.montant || 0));
      document.getElementById('s-sale').textContent = formatMoney(sale);
      document.getElementById('s-propre').textContent = formatMoney(propre);

      // Membres
      const membres = await getMembres();
      document.getElementById('s-membres').textContent = membres.length;

      // Actions semaine
      if (semaine) {
        const snapA = await db.ref('actions/' + semaine.id).once('value');
        const actions = Object.entries(snapA.val() || {}).map(([id, d]) => ({ id, ...d }));
        document.getElementById('s-actions').textContent = actions.length;
        document.getElementById('s-reussi').textContent = actions.filter(a => a.resultat === 'Succès').length;
        document.getElementById('s-echoue').textContent = actions.filter(a => a.resultat === 'Échec').length;

        // Dernières actions
        const sorted = [...actions].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 10);
        const tbody = document.getElementById('last-actions');
        if (!sorted.length) {
          tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📋</div>Aucune action cette semaine</div></td></tr>';
        } else {
          tbody.innerHTML = sorted.map(a => `<tr>
            <td>${a.heure || '-'}</td>
            <td>${a.prenom_membre || '-'}</td>
            <td>${a.action || '-'}</td>
            <td>${a.produit_drogue || '-'}</td>
            <td><span class="badge ${a.resultat === 'Succès' ? 'badge-success' : 'badge-danger'}">${a.resultat || '-'}</span></td>
            <td style="color:var(--accent)">${formatMoney(a.gains_totaux)}</td>
          </tr>`).join('');
        }

        // Classement
        const stats = {};
        actions.forEach(a => {
          if (!stats[a.membre_id]) stats[a.membre_id] = { nom: a.prenom_membre + ' ' + (a.nom_membre || ''), total: 0, reussi: 0, gains: 0 };
          stats[a.membre_id].total++;
          if (a.resultat === 'Succès') { stats[a.membre_id].reussi++; stats[a.membre_id].gains += a.gains_totaux || 0; }
        });
        const cl = Object.values(stats).sort((a, b) => b.gains - a.gains);
        document.getElementById('classement').innerHTML = cl.length ? cl.map((m, i) => `<tr>
          <td>${i + 1 === 1 ? '🥇' : i + 1 === 2 ? '🥈' : i + 1 === 3 ? '🥉' : i + 1}</td>
          <td>${m.nom}</td><td>${m.total}</td><td>${m.reussi}</td>
          <td style="color:var(--accent)">${formatMoney(m.gains)}</td>
        </tr>`).join('') : '<tr><td colspan="5"><div class="empty-state">Pas encore de données</div></td></tr>';
      }

      // Alertes stock
      const alertesZone = document.getElementById('alertes-zone');
      let alertesHTML = '';
      const snapStock = await db.ref('stock').once('value');
      Object.values(snapStock.val() || {}).forEach(cat => {
        Object.values(cat.produits || {}).forEach(p => {
          if (p.stock <= p.seuil) {
            alertesHTML += `<div class="alert alert-warning">⚠️ Stock bas : <strong>${p.nom}</strong> — ${p.stock} unités restantes (seuil : ${p.seuil})</div>`;
          }
        });
      });
      alertesZone.innerHTML = alertesHTML;
    }

    loadDashboard();
    setInterval(loadDashboard, 60000);
  </script>
</body>
</html>
